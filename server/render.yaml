services:
  - type: web
    name: innerecho-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3005
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        generateValue: true
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1
